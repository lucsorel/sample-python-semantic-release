name: code-quality

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-code-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  MIN_CODE_COVERAGE_PERCENT: 95

jobs:
  code-quality:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Project checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache lint hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          # cache key: Python version, hooks are specified in .pre-commit-config.yaml and configured in pyproject.toml
          key: pre-commit-4|${{ hashFiles('.python-version') }}|${{ hashFiles('.pre-commit-config.yaml') }}|${{ hashFiles('pyproject.toml') }}

      - name: Lint code
        run: uv run --frozen pre-commit run --show-diff-on-failure --color=always --all-files

      - name: Automated tests with coverage
        run: uv run --frozen pytest -v --cov=sample_python_semantic_release --cov-branch --cov-report term-missing --cov-fail-under $MIN_CODE_COVERAGE_PERCENT
