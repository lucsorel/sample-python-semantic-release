name: code-quality

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIN_CODE_COVERAGE_PERCENT: 95

jobs:
  code-quality:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: project checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: lint
        run: uv run pre-commit run --all-files

      - name: test
        run: uv run pytest -v --cov=sample_python_semantic_release --cov-branch --cov-report term-missing --cov-fail-under $MIN_CODE_COVERAGE_PERCENT
